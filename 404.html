<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Страница не найдена — примеры работ</title>
<style>
  :root{--bg:#0f1113;--card:#171a1d;--ink:#f2f1ee;--muted:#9aa1a8;--accent:#c9a227;--line:rgba(242,241,238,.12)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:660px;margin:0 auto;padding:72px 20px 72px}
  .code{font-size:clamp(64px,18vw,120px);font-weight:800;line-height:.9;letter-spacing:-.04em;color:var(--accent);margin:0 0 18px}
  h1{font-size:clamp(24px,4.6vw,34px);line-height:1.15;margin:0 0 12px;letter-spacing:-.02em}
  p{color:var(--muted);margin:0 0 26px;max-width:52ch}
  .links{display:flex;flex-wrap:wrap;gap:10px}
  a{display:inline-flex;align-items:center;min-height:50px;padding:0 22px;border-radius:999px;text-decoration:none;font-weight:600;font-size:15px}
  .primary{background:var(--accent);color:#141414}
  .ghost{border:1px solid var(--line);color:var(--ink)}
  footer{margin-top:40px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <p class="code">404</p>
  <h1>Такой страницы нет</h1>
  <p>Возможно, ссылка устарела или в адресе опечатка. Все демо-сайты — на главной странице.</p>
  <div class="links">
    <a class="primary" href="/demos/">К списку работ</a>
    <a class="ghost" href="https://wa.me/79020153104?text=%D0%97%D0%B4%D1%80%D0%B0%D0%B2%D1%81%D1%82%D0%B2%D1%83%D0%B9%D1%82%D0%B5!%20%D0%9D%D0%B5%20%D0%BD%D0%B0%D1%88%D1%91%D0%BB%20%D1%81%D1%82%D1%80%D0%B0%D0%BD%D0%B8%D1%86%D1%83%20%D0%BD%D0%B0%20%D1%81%D0%B0%D0%B9%D1%82%D0%B5" target="_blank" rel="noopener">Написать в WhatsApp</a>
  </div>
  <footer>Демо-сайты для малого бизнеса · сайт под ключ 3 000 ₽</footer>
</div>
</body>
</html>
